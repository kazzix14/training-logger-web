name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test.mjs
      - run: node test-ui.mjs
      - run: node test-reader.mjs

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"
      - name: Install the SwiftWasm SDK
        run: >-
          swift sdk install
          https://github.com/swiftwasm/swift/releases/download/swift-wasm-6.1-RELEASE/swift-wasm-6.1-RELEASE-wasm32-unknown-wasi.artifactbundle.zip
          --checksum 7550b4c77a55f4b637c376f5d192f297fe185607003a6212ad608276928db992
      - name: Build the reactor wasm core
        working-directory: Core
        run: |
          # crt1-reactor でリンクし、_initialize を持つ WASI reactor にする
          # (--no-entry だけでは command 用 crt の _start が残り reactor にならない)
          swift build -c release --product CoreWasm \
            --swift-sdk wasm32-unknown-wasi \
            -Xswiftc -Xclang-linker -Xswiftc -mexec-model=reactor \
            -Xlinker --export-memory \
            -Xlinker --export-if-defined=__wasm_call_ctors \
            -Xlinker --export=tl_alloc \
            -Xlinker --export=tl_free \
            -Xlinker --export=tl_validate \
            -Xlinker --export=tl_program_fixture \
            -Xlinker --export=tl_free_result \
            -Xlinker --strip-all
      - name: Shrink core.wasm (wasm-opt)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq binaryen || true
          true
      - name: Stage core.wasm
        run: |
          wasm_path="$(find Core/.build -type f -name CoreWasm.wasm -path '*/release/*' -print -quit)"
          test -n "$wasm_path"
          if command -v wasm-opt >/dev/null; then
            wasm-opt -Oz "$wasm_path" -o core.wasm || cp "$wasm_path" core.wasm
          else
            cp "$wasm_path" core.wasm
          fi
          ls -la core.wasm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test-parity.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: core-wasm
          path: core.wasm
          if-no-files-found: error

  deploy:
    needs: [test, wasm]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: core-wasm
          path: .
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
