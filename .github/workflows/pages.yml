name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test.mjs
      - run: node test-ui.mjs
      - run: node test-reader.mjs
      - run: node test-catalog.mjs

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"
      - name: Install the SwiftWasm SDK
        run: >-
          swift sdk install
          https://github.com/swiftwasm/swift/releases/download/swift-wasm-6.1-RELEASE/swift-wasm-6.1-RELEASE-wasm32-unknown-wasi.artifactbundle.zip
          --checksum 7550b4c77a55f4b637c376f5d192f297fe185607003a6212ad608276928db992
      - name: Build the reactor wasm core
        working-directory: Core
        run: |
          # crt1-reactor でリンクし、_initialize を持つ WASI reactor にする
          # (--no-entry だけでは command 用 crt の _start が残り reactor にならない)
          swift build -c release --product CoreWasm \
            --swift-sdk wasm32-unknown-wasi \
            -Xswiftc -Xclang-linker -Xswiftc -mexec-model=reactor \
            -Xlinker --export-memory \
            -Xlinker --export-if-defined=__wasm_call_ctors \
            -Xlinker --export=tl_alloc \
            -Xlinker --export=tl_free \
            -Xlinker --export=tl_validate \
            -Xlinker --export=tl_program_fixture \
            -Xlinker --export=tl_free_result \
            -Xlinker --strip-all
      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq binaryen
      - name: Stage core.wasm
        run: |
          wasm_path="$(find Core/.build -type f -name CoreWasm.wasm -path '*/release/*' -print -quit)"
          test -n "$wasm_path"
          # wasm-opt の失敗を握り潰すと未最適化の wasm が黙って公開されるので、
          # フォールバックは残しつつ warning で必ず気付けるようにする
          if wasm-opt -Oz --enable-bulk-memory --enable-sign-ext \
              "$wasm_path" -o core.wasm; then
            echo "wasm-opt -Oz: ok"
          else
            echo "::warning::wasm-opt に失敗したため未最適化の wasm を公開します"
            cp "$wasm_path" core.wasm
          fi
          before=$(stat -c%s "$wasm_path")
          after=$(stat -c%s core.wasm)
          gzipped=$(gzip -9 -c core.wasm | wc -c)
          echo "core.wasm: build=${before}B opt=${after}B gzip=${gzipped}B"
          # 素の import Foundation が1つ混ざると ICU のデータ節 35MB が復活する。
          # 現状 9MB 前後なので 16MB を上限にして黙って戻るのを防ぐ (ADR-0079)
          limit=$((16 * 1024 * 1024))
          if [ "$after" -gt "$limit" ]; then
            echo "::error::core.wasm が ${limit}B を超えました。Foundation 経由で ICU を巻き込んでいないか確認してください (ADR-0079)"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test-parity.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: core-wasm
          path: core.wasm
          if-no-files-found: error

  deploy:
    needs: [test, wasm]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: core-wasm
          path: .
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
